        ["एका शेतात काही घोडे आणि कोंबड्या आहेत. त्यांच्या डोक्यांची एकूण संख्या 55 आणि पायांची एकूण संख्या 150 आहे. शेतात किती घोडे व किती कोंबड्या आहेत?", "x + y = 55 आणि 4x + 2y = 150 ⇒ 2x + y = 75 ⇒ x = 20 घोडे, y = 35 कोंबड्या."],
        ["3 ओळींच्या संख्या पिरॅमिडच्या तळच्या ओळीत पहिल्या तीन विरहांक-फिबोनाची संख्या (1, 2, 3) लिहिल्या आहेत. पिरॅमिड पूर्ण करा व सर्वात वरची संख्या सांगा.", "दुसरी ओळ: 3, 5; सर्वात वरची संख्या: 8; या सर्व विरहांक-फिबोनाची संख्या आहेत."]
      ]
    },
    "14": {
      title: "क्षेत्रफळ",
      blueprint: { mcq: 4, m1: 2, m2: 3, m3: 0, m4: 2 },
      mcq: [
        ["जर एका आयताची लांबी 4 सेमी आणि रुंदी 6 सेमी असेल, तर क्षेत्रफळ किती?", ["24 चौ.सेमी", "12 चौ.सेमी", "10 चौ.सेमी", "20 चौ.सेमी"], "A) 24 चौ.सेमी"],
        ["जर एका चौरसाची परिमिती 20 सेमी असेल, तर त्याचे क्षेत्रफळ किती?", ["50 चौ.सेमी", "16 चौ.सेमी", "40 चौ.सेमी", "25 चौ.सेमी"], "D) 25 चौ.सेमी"],
        ["5 सेमी पाया आणि 8 सेमी उंची असलेल्या त्रिकोणाचे क्षेत्रफळ किती?", ["15 चौ.सेमी", "20 चौ.सेमी", "40 चौ.सेमी", "10 चौ.सेमी"], "B) 20 चौ.सेमी"],
        ["समांतरभुज चौकोनाचे क्षेत्रफळ काढण्याचे सूत्र कोणते?", ["1/2×पाया×उंची", "2×पाया×उंची", "4×पाया×उंची", "पाया×उंची"], "D) पाया×उंची"],
        ["ज्या समभुज चौकोनाचे कर्ण 10 सेमी आणि 12 सेमी आहेत, त्याचे क्षेत्रफळ किती?", ["120 चौ.सेमी", "60 चौ.सेमी", "240 चौ.सेमी", "30 चौ.सेमी"], "B) 60 चौ.सेमी"],
        ["समलंब चौकोनाचे क्षेत्रफळ 60 चौ.सेमी व समांतर बाजूंची बेरीज 30 सेमी असल्यास उंची किती?", ["4 सेमी", "8 सेमी", "12 सेमी", "24 सेमी"], "A) 4 सेमी"],
        ["समद्विभुज काटकोन त्रिकोणाची एक समान बाजू 8 सेमी असल्यास क्षेत्रफळ किती?", ["16 चौ.सेमी", "48 चौ.सेमी", "64 चौ.सेमी", "32 चौ.सेमी"], "D) 32 चौ.सेमी"]
      ],
      m1: [
        ["जर चौरसाची बाजू दुप्पट केली, तर त्याच्या क्षेत्रफळात काय बदल होईल?", "क्षेत्रफळ चार पटीने वाढते."],
        ["एका समांतरभुज चौकोनाचे क्षेत्रफळ 50 चौ.सेमी आणि पाया 10 सेमी असल्यास उंची शोधा.", "50 ÷ 10 = 5 सेमी"],
        ["7.5 सेमी बाजू असलेल्या समभुज चौकोनाची परिमिती शोधा.", "4 × 7.5 = 30 सेमी"],
        ["समलंब चौकोनाचे क्षेत्रफळ काढण्याचे सूत्र लिहा.", "क्षेत्रफळ = (1/2) × (a + b) × h"]
      ],
      m2: [
        ["एका आयताकृती मैदानाच्या लांबी व रुंदीचे गुणोत्तर 3 : 2 असून क्षेत्रफळ 600 चौ.मी. आहे. लांबी व रुंदी शोधा.", "6x² = 600 ⇒ x = 10; लांबी = 30 मी, रुंदी = 20 मी."],
        ["एका चौरसाचे क्षेत्रफळ 441 चौ.सेमी आहे. त्याची परिमिती शोधा.", "बाजू = √441 = 21 सेमी; परिमिती = 4 × 21 = 84 सेमी."],
        ["एका समभुज चौकोनाचे कर्ण 16 सेमी आणि 12 सेमी आहेत. त्याचे क्षेत्रफळ शोधा.", "(1/2) × 16 × 12 = 96 चौ.सेमी."],
        ["एका समलंब चौकोनाचे क्षेत्रफळ 162 चौ.सेमी, उंची 9 सेमी व एक समांतर बाजू 15 सेमी असल्यास दुसरी समांतर बाजू काढा.", "(9/2)(15 + b) = 162 ⇒ 15 + b = 36 ⇒ b = 21 सेमी."]
      ],
      m3: [
        ["50 मी लांब व 40 मी रुंद आयताकृती बागेच्या आतून 2 मी रुंदीचा रस्ता तयार केला आहे. त्या रस्त्याचे क्षेत्रफळ काढा.", "बाहेरील = 2000; आतील = 46 × 36 = 1656; रस्ता = 344 चौ.मी."],
        ["एका आयताची लांबी 9 सेमी व रुंदी 3 सेमी आहे. त्याच्या क्षेत्रफळाचे परिमितीशी असलेले गुणोत्तर काढा.", "क्षेत्रफळ = 27, परिमिती = 24; गुणोत्तर = 27 : 24 = 9 : 8."],
        ["एका समभुज चौकोनाची परिमिती 52 सेमी व एक कर्ण 24 सेमी आहे. त्याचे क्षेत्रफळ काढा.", "बाजू = 13 सेमी; दुसऱ्या कर्णाचा अर्धा = 5 ⇒ दुसरा कर्ण = 10 सेमी; क्षेत्रफळ = (1/2)×24×10 = 120 चौ.सेमी."]
      ],
      m4: [
        ["एका शेतकऱ्याची जमीन समलंब चौकोनाकार असून समांतर बाजू 45 मी व 65 मी आणि अंतर 30 मी आहे. प्रति चौ.मी. 10 किग्रॅ भाज्या पिकत असल्यास एकूण उत्पादन काढा.", "क्षेत्रफळ = (1/2)×(45+65)×30 = 1650 चौ.मी.; एकूण उत्पादन = 1650 × 10 = 16,500 किग्रॅ."],
        ["एक भिंत समलंब चौकोनाकार असून तिच्या समांतर बाजू 12 मी व 18 मी आणि लंब अंतर 10 मी आहे. ₹50 प्रति चौ.मी. दराने रंगवण्याचा एकूण खर्च काढा.", "क्षेत्रफळ = (1/2)×(12+18)×10 = 150 चौ.मी.; एकूण खर्च = 150 × 50 = ₹7,500."],
        ["एका समभुज चौकोनी मैदानाचे कर्ण 50 मी आणि 120 मी आहेत. ₹25 प्रति मीटर दराने चहूबाजूंनी कुंपण घालण्याचा एकूण खर्च काढा.", "बाजू = √(25² + 60²) = 65 मी; परिमिती = 4 × 65 = 260 मी; एकूण खर्च = 260 × 25 = ₹6,500."]
      ]
    }
  };

  var lessonWrap = root.querySelector("#sg8mp2Lessons"),
      school = root.querySelector("#sg8mp2School"),
      test = root.querySelector("#sg8mp2Test"),
      time = root.querySelector("#sg8mp2Time"),
      status = root.querySelector("#sg8mp2Status"),
      previewArea = root.querySelector("#sg8mp2PreviewArea"),
      paper = root.querySelector("#sg8mp2Paper"),
      btnGen = root.querySelector("#sg8mp2Generate"),
      btnKey = root.querySelector("#sg8mp2Key"),
      btnPrev = root.querySelector("#sg8mp2Preview"),
      btnPrint = root.querySelector("#sg8mp2Print"),
      btnAll = root.querySelector("#sg8mp2SelectAll");

  var current = null, paperMode = "qcas";

  Object.keys(DB).forEach(function (k) {
    var lab = document.createElement("label");
    lab.className = "sg8mp2-lesson";
    lab.innerHTML = '<input type="checkbox" class="sg8mp2-chk" value="' + k + '"> <span>' + k + ". " + DB[k].title + "</span>";
    lessonWrap.appendChild(lab);
  });

  function syncModeTabs(mode) {
    paperMode = mode;
    var btns = root.querySelectorAll(".sg8mp2-tabBtn, .sg8mp2-miniTab");
    for (var i = 0; i < btns.length; i++) {
      if (btns[i].getAttribute("data-mode") === mode) {
        btns[i].classList.add("sg8mp2-active");
      } else {
        btns[i].classList.remove("sg8mp2-active");
      }
    }
    if (current) render();
  }

  var modeBtns = root.querySelectorAll(".sg8mp2-tabBtn, .sg8mp2-miniTab");
  for (var mb = 0; mb < modeBtns.length; mb++) {
    modeBtns[mb].addEventListener("click", function () {
      syncModeTabs(this.getAttribute("data-mode"));
    });
  }

  function esc(v) {
    var d = document.createElement("div");
    d.textContent = v == null ? "" : String(v);
    return d.innerHTML;
  }
  function shuf(a) {
    var x = a.slice();
    for (var i = x.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = x[i]; x[i] = x[j]; x[j] = t;
    }
    return x;
  }
  function checked() {
    return Array.prototype.slice.call(root.querySelectorAll(".sg8mp2-chk:checked")).map(function (x) { return x.value; });
  }
  function msg(t, good) {
    status.className = "sg8mp2-status " + (good ? "sg8mp2-ok" : "sg8mp2-warn");
    status.textContent = t;
  }
  function pool(ids, type) {
    var a = [];
    ids.forEach(function (id) { a = a.concat(DB[id][type] || []); });
    return shuf(a);
  }

  function generate() {
    var ids = checked();
    if (!ids.length) {
      msg("कृपया किमान एक पाठ निवडा.", false);
      alert("कृपया किमान एक पाठ निवडा.");
      return;
    }
    var cfg = ids.length === 1 ? DB[ids[0]].blueprint : { mcq: 4, m1: 3, m2: 3, m3: 1, m4: 1 };
    var p = {
      mcq: pool(ids, "mcq"),
      m1: pool(ids, "m1"),
      m2: pool(ids, "m2"),
      m3: pool(ids, "m3"),
      m4: pool(ids, "m4")
    };
    var sel = {
      mcq: p.mcq.slice(0, cfg.mcq),
      m1: p.m1.slice(0, cfg.m1),
      m2: p.m2.slice(0, cfg.m2),
      m3: p.m3.slice(0, cfg.m3),
      m4: p.m4.slice(0, cfg.m4)
    };
    var totalMarks = sel.mcq.length * 1 + sel.m1.length * 1 + sel.m2.length * 2 + sel.m3.length * 3 + sel.m4.length * 4;
    current = {
      school: school.value.trim() || "शाळेचे नाव",
      test: test.value.trim() || "अध्ययन आधारित मूल्यमापन (LBA)",
      marks: totalMarks,
      time: time.value,
      sel: sel
    };
    render();
    previewArea.style.display = "block";
    btnKey.disabled = false;
    btnPrev.disabled = false;
    btnPrint.disabled = false;
    btnKey.textContent = "&#x1f511; उत्तरतालिका दाखवा / लपवा";
    msg("20 गुणांची प्रश्नपत्रिका यशस्वीरीत्या तयार झाली.", true);
    setTimeout(function () {
      try { previewArea.scrollIntoView({ behavior: "smooth", block: "start" }); }
      catch (e) { previewArea.scrollIntoView(); }
    }, 60);
  }

  function render() {
    var d = current, s = d.sel, isAns = (paperMode === "qcas"), h = "", key = "", qn = 1;
    paper.className = "sg8mp2-sheet" + (isAns ? "" : " sg8mp2-qpOnly");
    h += '<div class="sg8mp2-header">';
    h += '<div class="sg8mp2-school">' + esc(d.school) + "</div>";
    h += '<div class="sg8mp2-test">' + esc(d.test) + "</div>";
    h += '<div class="sg8mp2-modeBadge">' + (isAns ? "प्रश्न-कम-उत्तरपत्रिका (Question Cum Answer Sheet)" : "प्रश्नपत्रिका (Question Paper)") + "</div>";
    h += '<div class="sg8mp2-meta"><span>इयत्ता: 8 वी</span><span>विषय: गणित (भाग - 2)</span><span>एकूण गुण: ' + d.marks + "</span><span>वेळ: " + d.time + " मिनिटे</span></div>";
    if (isAns) {
      h += '<div class="sg8mp2-studentRow"><span>विद्यार्थ्याचे नाव: ____________________________________</span><span>हजेरी क्र.: ______</span><span>दिनांक: ___/___/20__</span></div>';
    }
    h += "</div>";

    key = '<div id="sg8mp2KeySheet" class="sg8mp2-keySheet"><div class="sg8mp2-keyTitle">उत्तरतालिका (Answer Key)</div>';

    if (s.mcq.length) {
      h += '<div class="sg8mp2-sec"><div class="sg8mp2-qhead"><span>प्र. ' + qn + '. योग्य पर्याय निवडून पूर्ण उत्तर लिहा.</span><span class="sg8mp2-qmarks">[' + s.mcq.length + " × 1 = " + s.mcq.length + " गुण]</span></div>";
      key += '<div class="sg8mp2-qhead"><span>प्र. ' + qn + ". बहुपर्यायी उत्तरे:</span></div>";
      s.mcq.forEach(function (x, i) {
        h += '<div class="sg8mp2-qblock"><div class="sg8mp2-q">' + (i + 1) + ") " + esc(x[0]) + '</div><div class="sg8mp2-options">';
        x[1].forEach(function (o, j) { h += "<div>" + String.fromCharCode(65 + j) + ") " + esc(o) + "</div>"; });
        h += "</div>";
        if (isAns) h += '<div class="sg8mp2-ansLine"><span>उत्तर:</span><span class="sg8mp2-line"></span></div>';
        h += "</div>";
        key += '<div class="sg8mp2-keyAns">' + (i + 1) + ") " + esc(x[2]) + "</div>";
      });
      h += "</div>"; qn++;
    }

    if (s.m1.length) {
      h += '<div class="sg8mp2-sec"><div class="sg8mp2-qhead"><span>प्र. ' + qn + '. खालील प्रश्नांची एका वाक्यात / एका पायरीत उत्तरे लिहा.</span><span class="sg8mp2-qmarks">[' + s.m1.length + " × 1 = " + s.m1.length + " गुण]</span></div>";
      key += '<div class="sg8mp2-qhead"><span>प्र. ' + qn + ". एक गुणांची उत्तरे:</span></div>";
      s.m1.forEach(function (x, i) {
        h += '<div class="sg8mp2-qblock"><div class="sg8mp2-q">' + (i + 1) + ") " + esc(x[0]) + "</div>";
        if (isAns) h += '<div class="sg8mp2-ansLine"><span>उत्तर:</span><span class="sg8mp2-line"></span></div>';
        h += "</div>";
        key += '<div class="sg8mp2-keyAns">' + (i + 1) + ") " + esc(x[1]) + "</div>";
      });
      h += "</div>"; qn++;
    }

    if (s.m2.length) {
      h += '<div class="sg8mp2-sec"><div class="sg8mp2-qhead"><span>प्र. ' + qn + '. खालील उदाहरणे सोडवा.</span><span class="sg8mp2-qmarks">[' + s.m2.length + " × 2 = " + (s.m2.length * 2) + " गुण]</span></div>";
      key += '<div class="sg8mp2-qhead"><span>प्र. ' + qn + ". दोन गुणांची उत्तरे:</span></div>";
      s.m2.forEach(function (x, i) {
        h += '<div class="sg8mp2-qblock"><div class="sg8mp2-q">' + (i + 1) + ") " + esc(x[0]) + "</div>";
        if (isAns) h += '<div class="sg8mp2-box"></div>';
        h += "</div>";
        key += '<div class="sg8mp2-keyAns">' + (i + 1) + ") " + esc(x[1]) + "</div>";
      });
      h += "</div>"; qn++;
    }

    if (s.m3.length) {
      h += '<div class="sg8mp2-sec"><div class="sg8mp2-qhead"><span>प्र. ' + qn + '. खालील उदाहरणे पायरी-पायरीने सोडवा.</span><span class="sg8mp2-qmarks">[' + s.m3.length + " × 3 = " + (s.m3.length * 3) + " गुण]</span></div>";
      key += '<div class="sg8mp2-qhead"><span>प्र. ' + qn + ". तीन गुणांची उत्तरे:</span></div>";
      s.m3.forEach(function (x, i) {
        h += '<div class="sg8mp2-qblock"><div class="sg8mp2-q">' + (i + 1) + ") " + esc(x[0]) + "</div>";
        if (isAns) h += '<div class="sg8mp2-box sg8mp2-medbox"></div>';
        h += "</div>";
        key += '<div class="sg8mp2-keyAns">' + (i + 1) + ") " + esc(x[1]) + "</div>";
      });
      h += "</div>"; qn++;
    }

    if (s.m4.length) {
      h += '<div class="sg8mp2-sec"><div class="sg8mp2-qhead"><span>प्र. ' + qn + '. खालील प्रश्न सविस्तर सोडवा.</span><span class="sg8mp2-qmarks">[' + s.m4.length + " × 4 = " + (s.m4.length * 4) + " गुण]</span></div>";
      key += '<div class="sg8mp2-qhead"><span>प्र. ' + qn + ". चार गुणांची उत्तरे:</span></div>";
      s.m4.forEach(function (x, i) {
        h += '<div class="sg8mp2-qblock"><div class="sg8mp2-q">' + (i + 1) + ") " + esc(x[0]) + "</div>";
        if (isAns) h += '<div class="sg8mp2-box sg8mp2-longbox"></div>';
        h += "</div>";
        key += '<div class="sg8mp2-keyAns">' + (i + 1) + ") " + esc(x[1]) + "</div>";
      });
      h += "</div>";
    }

    h += '<div class="sg8mp2-watermark">SmartGuruji</div>';
    key += "</div>";
    paper.innerHTML = h + key;
  }

  btnGen.addEventListener("click", function (e) { e.preventDefault(); generate(); });
  btnAll.addEventListener("click", function () {
    var c = root.querySelectorAll(".sg8mp2-chk"), all = true;
    for (var i = 0; i < c.length; i++) if (!c[i].checked) { all = false; break; }
    for (var j = 0; j < c.length; j++) c[j].checked = !all;
  });
  btnKey.addEventListener("click", function () {
    if (!current) return;
    var s = paper.querySelector("#sg8mp2KeySheet");
    if (!s) return;
    var show = s.style.display !== "block";
    s.style.display = show ? "block" : "none";
    btnKey.textContent = show ? "&#x1f510; उत्तरतालिका लपवा" : "&#x1f511; उत्तरतालिका दाखवा / लपवा";
  });
  btnPrev.addEventListener("click", function () {
    if (!current) return;
    try { previewArea.scrollIntoView({ behavior: "smooth", block: "start" }); }
    catch (e) { previewArea.scrollIntoView(); }
  });
  btnPrint.addEventListener("click", function () {
    if (!current) { alert("प्रथम पेपर तयार करा."); return; }
    window.print();
  });
})();
</script>
